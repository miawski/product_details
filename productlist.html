<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link rel="icon" type="image/png" href="img/npc-logo.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/grid.css" />
    <link rel="stylesheet" href="css/uxui.css?v=0beda52" />
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="logo">
        <img src="img/npc-logo.png" alt="NPC logo" />
      </a>
      <nav>
        <a href="productlist.html">Products</a>
      </nav>
    </header>

    <main>
      <section class="intro">
        <div class="intro-copy">
          <h1>Shop</h1>
          <h2 id="category-title" hidden></h2>
        </div>
        <nav id="filters" class="gender-filter-buttons" aria-label="Filter products by gender">
          <button type="button" data-gender-filter="All" aria-pressed="true">All</button>
          <button type="button" data-gender-filter="Unisex" aria-pressed="false">Unisex</button>
          <button type="button" data-gender-filter="Women" aria-pressed="false">Women</button>
          <button type="button" data-gender-filter="Men" aria-pressed="false">Men</button>
          <span class="product-count visually-hidden" id="product-count" aria-live="polite">0 products found</span>
        </nav>
      </section>

      <section class="product-list" aria-label="Product list"></section>
    </main>

    <script src="js/productlist.js"></script>
  </body>
</html>
